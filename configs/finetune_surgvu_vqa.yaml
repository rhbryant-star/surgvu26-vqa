### model — model_name_or_path is patched to the staged snapshot at runtime
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 401408      # = inference MAX_PIXELS (512 visual tokens/frame)
image_min_pixels: 200704      # = inference MIN_PIXELS
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj

### dataset — registered by the wrapper's data/dataset_info.json
dataset: surgvu_vqa_train
eval_dataset: surgvu_vqa_val
template: qwen2_vl
cutoff_len: 6144              # 8 frames x <=512 visual tokens + text
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /staging/groups/bhaskar_opscribe/adapters/surgvu_vqa_v1
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1   # 8-image samples
gradient_accumulation_steps: 16  # eff. batch 32 on 2 GPUs
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
